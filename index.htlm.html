```html
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>El Monstruo de Colores - Juego</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:"Trebuchet MS", Arial, sans-serif;
    background:linear-gradient(135deg,#fff8c9,#dff7ff,#f4e3ff);
    color:#263238;
}

/* CONTENEDOR PRINCIPAL */

.app{
    max-width:900px;
    margin:auto;
    padding:20px 15px 35px;
}

/* ENCABEZADO */

.header{
    background:white;
    border-radius:28px;
    padding:20px;
    text-align:center;
    box-shadow:0 10px 30px rgba(70,70,100,.15);
}

h1{
    margin:0;
    font-size:clamp(30px,6vw,48px);
    color:#5e35b1;
}

.subtitle{
    margin-top:8px;
    font-size:21px;
    font-weight:bold;
}

/* JUEGO */

.game{
    margin-top:18px;
    background:white;
    border-radius:30px;
    padding:22px;
    box-shadow:0 12px 35px rgba(70,70,100,.16);
}

/* BARRA DE PROGRESO */

.topbar{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:15px;
}

.progress-wrap{
    flex:1;
    background:#eeeeee;
    border-radius:20px;
    height:18px;
    overflow:hidden;
}

.progress{
    height:100%;
    width:20%;
    background:linear-gradient(90deg,#ffd54f,#ffca28);
    border-radius:20px;
    transition:.5s;
}

.counter{
    font-weight:bold;
    font-size:17px;
}

/* MONSTRUO */

.character-area{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:145px;
}

.monster{
    width:135px;
    height:135px;
    border-radius:48% 52% 45% 55%;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    box-shadow:0 8px 0 rgba(0,0,0,.08);
    animation:flotar 2.5s ease-in-out infinite;
}

.monster:before,
.monster:after{
    content:"";
    position:absolute;
    top:-12px;
    width:28px;
    height:32px;
    background:inherit;
    border-radius:70% 30% 70% 30%;
}

.monster:before{
    left:18px;
    transform:rotate(-25deg);
}

.monster:after{
    right:18px;
    transform:rotate(25deg);
}

.face{
    font-size:64px;
}

@keyframes flotar{

    50%{
        transform:translateY(-8px) rotate(2deg);
    }

}

/* PREGUNTA */

.question-card{
    border-radius:24px;
    padding:20px;
    text-align:center;
    background:#fafafa;
    border:4px solid #f0f0f0;
}

.question{
    font-size:clamp(21px,4vw,30px);
    line-height:1.3;
    margin:0 0 18px;
    font-weight:900;
}

/* ALTERNATIVAS */

.options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:13px;
}

.option{
    border:3px solid #ddd;
    background:white;
    border-radius:20px;
    padding:16px 12px;
    font-size:clamp(17px,3vw,21px);
    font-weight:bold;
    cursor:pointer;
    min-height:72px;
    transition:.18s;
    box-shadow:0 5px 0 #ddd;
}

.option:hover{
    transform:translateY(-3px);
    box-shadow:0 8px 0 #ccc;
}

.option:active{
    transform:translateY(2px);
}

.option.correct{
    border-color:#43a047;
    background:#e8f5e9;
    box-shadow:0 5px 0 #43a047;
}

.option.wrong{
    border-color:#e53935;
    background:#ffebee;
    box-shadow:0 5px 0 #e53935;
}

/* RETROALIMENTACIÓN */

.feedback{
    min-height:58px;
    margin-top:16px;
    border-radius:18px;
    padding:12px;
    font-size:19px;
    font-weight:bold;
    display:none;
    align-items:center;
    justify-content:center;
}

.feedback.show{
    display:flex;
}

.feedback.ok{
    background:#e8f5e9;
    color:#2e7d32;
}

.feedback.no{
    background:#fff3e0;
    color:#e65100;
}

/* BOTÓN SIGUIENTE */

.next{
    display:none;
    margin:18px auto 0;
    border:0;
    border-radius:25px;
    background:#7e57c2;
    color:white;
    padding:14px 30px;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 5px 0 #5e35b1;
}

.next.show{
    display:block;
}

.hint{
    font-size:16px;
    color:#607d8b;
    margin-top:12px;
}

/* PANTALLA INICIAL */

.start{
    text-align:center;
    padding:18px;
}

.start h2{
    font-size:30px;
}

.start p{
    font-size:19px;
}

.start button,
.restart{
    border:0;
    border-radius:30px;
    background:#ffb300;
    color:white;
    padding:15px 34px;
    font-size:22px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 6px 0 #e09100;
}

/* RESULTADO */

.result{
    display:none;
    text-align:center;
    padding:20px 10px;
}

.trophy{
    font-size:85px;
    animation:rebote 1s infinite alternate;
}

@keyframes rebote{

    to{
        transform:translateY(-10px);
    }

}

.score{
    font-size:42px;
    font-weight:900;
    color:#5e35b1;
    margin:8px;
}

.stars{
    font-size:42px;
    letter-spacing:5px;
}

.result p{
    font-size:22px;
    font-weight:bold;
    line-height:1.4;
}

.restart{
    background:#43a047;
    box-shadow:0 6px 0 #2e7d32;
}

/* CONFETI */

.confetti{
    position:fixed;
    top:-20px;
    font-size:25px;
    pointer-events:none;
    animation:caer 2.5s linear forwards;
    z-index:20;
}

@keyframes caer{

    to{
        transform:translateY(110vh) rotate(600deg);
        opacity:0;
    }

}

/* CELULAR */

@media(max-width:620px){

    .app{
        padding:10px 8px 25px;
    }

    .game{
        padding:14px;
    }

    .options{
        grid-template-columns:1fr;
    }

    .option{
        min-height:62px;
    }

    .character-area{
        min-height:125px;
    }

    .monster{
        width:110px;
        height:110px;
    }

    .face{
        font-size:52px;
    }

}

</style>
</head>


<body>

<div class="app">

<header class="header">

<h1>🎨 El Monstruo de Colores</h1>

<div class="subtitle">
🌈 ¡Ordenemos sus emociones!
</div>

</header>


<main class="game">


<!-- INICIO -->

<div id="inicio" class="start">

<div class="character-area">

<div class="monster" style="background:#ffd54f">

<div class="face">
😊
</div>

</div>

</div>

<h2>
¿Estás listo para jugar?
</h2>

<p>
Lee cada pregunta y elige la respuesta que creas correcta.
</p>

<button onclick="comenzar()">
🚀 ¡Comenzar!
</button>

</div>


<!-- JUEGO -->

<div id="juego" style="display:none">


<div class="topbar">

<div class="progress-wrap">

<div id="progress" class="progress">
</div>

</div>

<div id="counter" class="counter">
1 de 5
</div>

</div>


<div class="character-area">

<div id="monster"
class="monster"
style="background:#ffd54f">

<div id="face" class="face">
😊
</div>

</div>

</div>


<div class="question-card">

<p id="question" class="question">
</p>


<div id="options" class="options">
</div>


<div id="feedback" class="feedback">
</div>


<button
id="next"
class="next"
onclick="siguiente()">

➡️ Siguiente

</button>


<div class="hint">
💡 ¡Piensa en lo que decía el cuento!
</div>

</div>

</div>


<!-- RESULTADO -->

<div id="resultado" class="result">

<div class="trophy">
🏆
</div>

<h2>
¡Terminaste!
</h2>

<div id="score" class="score">
</div>

<div id="stars" class="stars">
</div>

<p id="finalMessage">
</p>

<button
class="restart"
onclick="reiniciar()">

🔄 Jugar otra vez

</button>

</div>


</main>

</div>


<script>


/* PREGUNTAS */

const preguntas = [

{
q:"¿Cómo se sentía el monstruo al comenzar el cuento?",

o:[
"Feliz y tranquilo",
"Raro, confuso y aturdido",
"Enojado porque tenía hambre",
"Triste porque estaba solo"
],

a:1,

c:"#ffd54f",

e:"😵",

ok:"¡Muy bien! El monstruo tenía todas sus emociones revueltas."
},


{
q:"¿De qué color es la alegría?",

o:[
"Azul",
"Verde",
"Amarillo",
"Negro"
],

a:2,

c:"#ffd54f",

e:"😄",

ok:"¡Correcto! La alegría es amarilla, como el sol."
},


{
q:"¿Qué color representa la tristeza?",

o:[
"Rojo",
"Azul",
"Amarillo",
"Verde"
],

a:1,

c:"#42a5f5",

e:"😢",

ok:"¡Excelente! La tristeza es azul, como el mar."
},


{
q:"¿Qué hace el monstruo cuando siente calma?",

o:[
"Grita y se enoja",
"Se esconde porque tiene miedo",
"Respira profundo y se siente en paz",
"Salta y baila"
],

a:2,

c:"#66bb6a",

e:"😌",

ok:"¡Muy bien! Cuando está en calma, respira profundo y siente paz."
},


{
q:"¿Qué hizo el monstruo para sentirse mucho mejor?",

o:[
"Se fue a dormir",
"Ordenó cada emoción en su bote",
"Dejó de sentir emociones",
"Mezcló todos los colores"
],

a:1,

c:"#ab47bc",

e:"🥰",

ok:"¡Correcto! Ordenó cada emoción en su bote correspondiente."
}

];


let actual=0;

let puntaje=0;

let respondida=false;


/* COMENZAR */

function comenzar(){

document.getElementById("inicio").style.display="none";

document.getElementById("juego").style.display="block";

mostrarPregunta();

}


/* MOSTRAR PREGUNTA */

function mostrarPregunta(){

const p=preguntas[actual];

respondida=false;


document.getElementById("counter").textContent=
(actual+1)+" de 5";


document.getElementById("progress").style.width=
((actual+1)*20)+"%";


document.getElementById("question").textContent=
p.q;


document.getElementById("monster").style.background=
p.c;


document.getElementById("face").textContent=
p.e;


const options=
document.getElementById("options");


options.innerHTML="";


p.o.forEach((texto,i)=>{


const boton=
document.createElement("button");


boton.className="option";


boton.innerHTML=
"<span>"+String.fromCharCode(65+i)+")</span> "+texto;


boton.onclick=
()=>responder(i,boton);


options.appendChild(boton);


});


const feedback=
document.getElementById("feedback");


feedback.className="feedback";

feedback.textContent="";


document.getElementById("next").className="next";


}


/* RESPONDER */

function responder(indice,boton){

if(respondida)return;

respondida=true;


const p=preguntas[actual];


const botones=
document.querySelectorAll(".option");


botones.forEach(b=>{
b.disabled=true;
});


if(indice===p.a){

puntaje++;


boton.classList.add("correct");


mostrarFeedback(
true,
p.ok
);


lanzarConfeti();


}else{


boton.classList.add("wrong");


botones[p.a].classList.add("correct");


mostrarFeedback(
false,
"💭 Casi... La respuesta correcta era: "+p.o[p.a]+"."
);

}


document.getElementById("next").classList.add("show");


if(actual===4){

document.getElementById("next").textContent=
"🏆 Ver mi puntuación";

}else{

document.getElementById("next").textContent=
"➡️ Siguiente";

}

}


/* FEEDBACK */

function mostrarFeedback(correcto,texto){

const fb=
document.getElementById("feedback");


fb.textContent=texto;


fb.className=
"feedback show "+
(correcto?"ok":"no");

}


/* SIGUIENTE */

function siguiente(){

if(!respondida)return;


actual++;


if(actual<5){

mostrarPregunta();

}else{

mostrarResultado();

}

}


/* RESULTADO */

function mostrarResultado(){

document.getElementById("juego").style.display="none";

document.getElementById("resultado").style.display="block";


document.getElementById("score").textContent=
"⭐ "+puntaje+" de 5 puntos";


let estrellas="";


for(let i=0;i<5;i++){

estrellas+=
i<puntaje?"⭐":"☆";

}


document.getElementById("stars").textContent=
estrellas;


let mensaje="";


if(puntaje===5){

mensaje=
"🌟 ¡Excelente! Conoces muy bien las emociones del monstruo.";

}

else if(puntaje>=3){

mensaje=
"👏 ¡Muy bien! Comprendiste gran parte del cuento.";

}

else{

mensaje=
"💪 ¡Buen esfuerzo! Puedes leer nuevamente el cuento y volver a jugar.";

}


document.getElementById("finalMessage").textContent=
mensaje;


lanzarConfeti();


window.scrollTo({
top:0,
behavior:"smooth"
});

}


/* REINICIAR */

function reiniciar(){

actual=0;

puntaje=0;

respondida=false;


document.getElementById("resultado").style.display="none";

document.getElementById("inicio").style.display="block";


window.scrollTo({
top:0,
behavior:"smooth"
});

}


/* CONFETI */

function lanzarConfeti(){

const simbolos=[
"🎉",
"⭐",
"🌈",
"💛",
"💙",
"❤️",
"💚"
];


for(let i=0;i<18;i++){

const s=
document.createElement("div");


s.className="confetti";


s.textContent=
simbolos[
Math.floor(
Math.random()*simbolos.length
)
];


s.style.left=
Math.random()*100+"vw";


s.style.animationDelay=
Math.random()*.4+"s";


document.body.appendChild(s);


setTimeout(()=>{
s.remove();
},3000);

}

}

</script>

</body>
</html>
```
